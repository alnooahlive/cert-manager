<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>تسجيل الدخول — مدير الشهادات</title>
<link rel="icon" href="/favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
  :root{--bg:#080e1a;--card:#131f38;--border:#1f2d4a;--text:#e8eef9;--muted:#7e93b8;--accent:#4f8cff;--accent2:#9b6bff;--danger:#f87171}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#1e3a8a33,transparent),var(--bg);font-family:'Tajawal',sans-serif;color:var(--text)}
  .card{width:100%;max-width:420px;background:linear-gradient(180deg,rgba(19,31,56,.95),rgba(13,21,38,.95));border:1px solid var(--border);border-radius:20px;padding:40px 34px;box-shadow:0 20px 60px #0006;animation:fadeIn .4s ease}
  h1{margin:0 0 6px;font-size:22px;font-weight:800}
  p.sub{margin:0 0 26px;color:var(--muted);font-size:14px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--border);background:rgba(8,14,26,.6);color:var(--text);font-size:15px;font-family:inherit;transition:border-color .18s}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #4f8cff22}
  button{width:100%;margin-top:24px;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px #4f8cff44;transition:transform .18s}
  button:hover{transform:translateY(-1px)}
  .err{margin-top:14px;color:var(--danger);font-size:13px;min-height:18px}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .logo .dot{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:0 4px 14px #4f8cff44}
  .remember{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--text)}
  .remember input{width:auto;margin:0}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><div class="dot">SSL</div><div><h1 style="margin:0;font-size:20px">مدير الشهادات</h1><p style="margin:0;color:var(--muted);font-size:12px">Mikrotik Hotspot</p></div></div>
    <p class="sub">تسجيل الدخول للمسؤول</p>
    <label>البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username" />
    <label>كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password" />
    <label class="remember"><input id="remember" type="checkbox" /> تذكرني (30 يوم)</label>
    <button onclick="login()">دخول</button>
    <div class="err" id="err"></div>
  </div>
<script>
async function login(){
  const err=document.getElementById('err'); err.textContent='';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,remember:remember.checked}),credentials:'include'});
    const d=await r.json();
    if(!r.ok){ err.textContent=d.error||'فشل الدخول'; return; }
    localStorage.setItem('token',d.token);
    location.href='/dashboard';
  }catch(e){ err.textContent='خطأ في الاتصال'; }
}
document.addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
